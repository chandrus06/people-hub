<div class="teams-container">
  <div class="header-section">
    <h1>Technology Core Teams</h1>
    <p class="subtitle">Meet the specialized teams driving our projects.</p>
  </div>

  <div class="teams-grid">
    <p-card *ngFor="let team of teams" styleClass="team-card">
      <ng-template pTemplate="header">
        <div class="team-header">
          <i class="pi pi-users team-icon"></i>
          <h3>{{ team.name }}</h3>
        </div>
      </ng-template>
      
      <div class="team-members">
        <div class="member-item" *ngFor="let member of team.members">
          <p-avatar 
            [label]="getInitials(member)" 
            [style]="{'background-color': member.includes('Lead') ? '#4f46e5' : '#e5e7eb', 'color': member.includes('Lead') ? '#ffffff' : '#374151'}" 
            shape="circle">
          </p-avatar>
          <div class="member-info">
            <span class="member-name" [class.is-lead]="member.includes('Lead')">
              {{ member.replace(' – Lead', '') }}
            </span>
            <span class="member-role" *ngIf="member.includes('Lead')">Team Lead</span>
            <span class="member-role" *ngIf="!member.includes('Lead')">Developer</span>
          </div>
        </div>
      </div>
    </p-card>
  </div>
</div>
